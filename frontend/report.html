<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interview Report — AI Interview System</title>
  <link rel="stylesheet" href="/static/styles/main.css" />
</head>
<body>

  <main class="report-page">
    <div class="report-container">

      <!-- Header -->
      <div class="report-topbar">
        <div class="topbar-left">
          <div class="logo-box logo-box--small">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                 viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
              <path d="M12 2a10 10 0 1 0 10 10"/>
              <path d="M12 6v6l4 2"/>
              <circle cx="18" cy="6" r="3"/>
            </svg>
          </div>
          <div>
            <h1 class="report-title">Interview Report</h1>
            <p class="report-candidate" id="report-candidate-name">Candidate</p>
          </div>
        </div>
        <div class="report-actions">
          <button class="btn btn-secondary" onclick="window.print()">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2">
              <polyline points="8 17 2 17 2 3 22 3 22 17 16 17"/>
              <rect x="8" y="13" width="8" height="8"/>
              <polyline points="8 13 8 9 16 9 16 13"/>
            </svg>
            Export
          </button>
          <button class="btn btn-primary" onclick="newInterview()">
            New Interview
          </button>
        </div>
      </div>

      <!-- Loading -->
      <div id="loading-state" class="center-state">
        <div class="spinner spinner--lg"></div>
        <p class="state-text">Loading your report…</p>
      </div>

      <!-- Error -->
      <div id="error-state" class="center-state hidden">
        <div class="alert alert-error" id="error-message"></div>
        <p class="state-subtext">
          Make sure the interview was completed and try refreshing.
        </p>
      </div>

      <!-- Report -->
      <div id="report-content" class="hidden">

        <div class="card score-card">
          <p class="score-label">Overall Score</p>
          <div class="score-display">
            <span class="score-star">★</span>
            <span class="score-value" id="overall-score">0.0</span>
            <span class="score-max">/10</span>
          </div>
          <div id="hire-badge" class="hire-badge"></div>
        </div>

        <div class="two-col">
          <div class="card border-left border-green">
            <h3 class="section-title text-green">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                   viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
              Strengths
            </h3>
            <p class="section-body" id="strengths-text"></p>
          </div>
          <div class="card border-left border-red">
            <h3 class="section-title text-red">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                   viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="15" y1="9" x2="9" y2="15"/>
                <line x1="9"  y1="9" x2="15" y2="15"/>
              </svg>
              Areas to Improve
            </h3>
            <p class="section-body" id="weaknesses-text"></p>
          </div>
        </div>

        <div class="card" id="qa-breakdown">
          <h3 class="breakdown-title">Question-by-Question Breakdown</h3>
          <div id="qa-list"></div>
        </div>

      </div>
    </div>
  </main>

  <script src="/static/scripts/api.js"></script>
  <script src="/static/scripts/report.js"></script>
</body>
</html>
