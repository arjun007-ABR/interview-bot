[project]
name = "ai-interview-backend"
version = "1.0.0"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",
  "sqlalchemy>=2.0.0",
  "asyncpg>=0.29.0",
  "alembic>=1.12.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "groq>=0.4.0",
  "langgraph>=0.0.40",
  "langchain>=0.1.0",
  "python-multipart>=0.0.6",
  "aiofiles>=23.2.1",
  "slowapi>=0.1.9",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "anyio>=4.13.0",
  "httpx>=0.28.1",
  "aiosqlite>=0.22.1",
  "pyttsx3>=2.99",
  "aiohttp>=3.13.5",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
  "anyio>=4.0.0",
  "httpx>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"
